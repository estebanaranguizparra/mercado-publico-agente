[project]
name = "mercado-publico-agente"
version = "0.1.0"
description = "Agente que analiza licitaciones de Mercado Público (ChileCompra) y prioriza oportunidades de producto"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
bases = [
    "pypdf>=5",
    "python-docx>=1",
]
dev = ["pytest>=8.0"]

[project.scripts]
mpagente = "mpagente.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpagente"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
